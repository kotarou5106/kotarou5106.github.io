# Pages placed under these sections will be shown on homepage and archive page.
mainSections = ["post"]
rssFullContent = true
favicon        = "favicon.ico?v=kotarou-k-1"
description    = "记录阅读与思考"

# Accepted values: "default", "lastmod"
# default = see https://gohugo.io/quick-reference/glossary/#default-sort-order
# lastmod = sort by last modified date, in descending order
SortBy              = "default"

[typography]
    # Self-hosted WOFF2 under assets/. Web font use authorized for kotarou.quest.
    headingFontResource = "fonts/fz-cukai.woff2"

[footer]
    since      = 2026
    customText = ""

[dateFormat]
    published   = ":date_full"
    lastUpdated = ":date_full"

[article]
    headingAnchor = false
    math          = true
    readingTime   = true

    [article.license]
        enabled = true
        default = "Licensed under CC BY-NC-SA 4.0"

[opengraph.twitter]
    site = ""
    card = "summary_large_image"
